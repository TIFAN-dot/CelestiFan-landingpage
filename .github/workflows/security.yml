name: Zero-Trust Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security_audit:
    name: Dependency & Code Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit (Vulnerability Check)
        run: npm audit --audit-level=high

      - name: Run SAST Security Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
        env:
          SEMGREP_RULES: p/javascript p/typescript p/owasp-top-10
